<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>MS-DOS Boot Failure — Simulation</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #000; color: #aaa; }
  body { font-family: 'Courier New', Courier, monospace; font-size: clamp(14px, 1.65vw, 22px); line-height: 1.2; }
  main { min-height: 100svh; padding: 12px 16px 90px; }
  #output { white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; font: inherit; }
  .cursor { display: inline-block; width: .62em; height: .16em; background: #aaa; vertical-align: baseline; animation: blink .8s steps(1, end) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  [hidden] { display: none !important; }
  .controls { position: fixed; bottom: 16px; right: 20px; left: 20px; display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 12px; font: 12px 'Segoe UI', Arial, sans-serif; color: white; opacity: 0; transition: opacity .15s; }
  .controls-visible .controls, .controls:hover, .controls:focus-within { opacity: 1; }
  button { background: #181818; border: 1px solid #666; border-radius: 3px; color: white; padding: 7px 11px; cursor: pointer; font: inherit; }
  button:hover { background: #303030; }
  button:focus-visible { outline: 2px solid white; outline-offset: 4px; }
  @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } .controls { transition: none; } }
</style>
</head>
<body class="controls-visible">
<main aria-label="MS-DOS boot failure simulation">
  <pre id="output"></pre><span id="cursor" class="cursor" aria-hidden="true" hidden></span>
</main>
<div class="controls" aria-label="Simulation controls">
  <span>Simulation</span>
  <button id="skip" type="button">Skip to error</button>
  <button id="replay" type="button">Replay boot</button>
  <button id="fullscreen" type="button">Fullscreen</button>
</div>
<script>
  const output = document.getElementById('output');
  const cursor = document.getElementById('cursor');
  const skip = document.getElementById('skip');
  let timers = [];
  function cancelSequence() { timers.forEach(clearTimeout); timers = []; }
  function after(delay, callback) { timers.push(setTimeout(callback, delay)); }
  function write(text) { output.textContent += text; }
  function failure() {
    cancelSequence();
    cursor.hidden = true;
    skip.hidden = true;
    output.textContent = 'An operating system was not found. Try disconnecting any drives that\ndon’t contain an operating system.\n\nPress any key to restart';
    // Keep the bootloader-style error onscreen; the displayed key instruction is decorative.
  }
  function start() {
    cancelSequence();
    skip.hidden = false;
    cursor.hidden = true;
    output.textContent = 'Starting MS-DOS...\n\n';
    after(650, () => write('HIMEM is testing extended memory...'));
    after(1550, () => write('done.\n\n'));
    after(2000, () => write('C:\\>C:\\DOS\\SMARTDRV.EXE /X\n'));
    after(2400, () => write('C:\\>PROMPT $p$g\n'));
    after(2750, () => write('C:\\>PATH C:\\DOS\n'));
    after(3100, () => write('C:\\>SET TEMP=C:\\DOS\n'));
    after(3500, () => write('C:\\>CLS\n'));
    // The command-line stage has only a blinking cursor, with no prompt or input.
    after(3700, () => { output.textContent = ''; cursor.hidden = false; });
    after(4600, () => { cursor.hidden = true; output.textContent = ''; });
    after(4950, () => { output.textContent = 'BIOS ROM checksum: OK\n'; });
    after(5350, () => write('Detecting IDE drives...\n'));
    after(5850, () => write('Booting from Hard Disk...\n'));
    after(6400, failure);
  }
  document.getElementById('replay').addEventListener('click', start);
  skip.addEventListener('click', failure);
  const fullscreen = document.getElementById('fullscreen');
  if (!document.fullscreenEnabled) fullscreen.hidden = true;
  fullscreen.addEventListener('click', async () => {
    try {
      if (document.fullscreenElement) await document.exitFullscreen();
      else await document.documentElement.requestFullscreen();
    } catch { fullscreen.textContent = 'Fullscreen unavailable'; }
  });
  document.addEventListener('fullscreenchange', () => {
    fullscreen.textContent = document.fullscreenElement ? 'Exit fullscreen' : 'Fullscreen';
  });
  let controlsTimer;
  function reveal() {
    document.body.classList.add('controls-visible');
    clearTimeout(controlsTimer);
    controlsTimer = setTimeout(() => document.body.classList.remove('controls-visible'), 2200);
  }
  document.addEventListener('pointermove', reveal);
  document.addEventListener('pointerdown', reveal);
  reveal();
  start();
</script>
</body>
</html>
