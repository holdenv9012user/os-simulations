<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#091b46">

<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{font:14px 'Segoe UI',Arial,sans-serif;color:#202020;background:#091b46}button,input,select,textarea{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #0067c0;outline-offset:3px}[hidden]{display:none!important}button:disabled{opacity:.45;cursor:default}.screen{position:fixed;inset:0}.setup{display:grid;place-items:center;padding:25px 18px 55px;background:radial-gradient(ellipse at 75% 85%,#144f99,#0c1745 65%)}.card{width:min(820px,100%);max-height:calc(100svh - 95px);overflow:auto;background:#fafafa;border:1px solid #ffffff70;border-radius:9px;box-shadow:0 24px 85px #0006}.caption{display:flex;gap:10px;align-items:center;padding:15px 22px;font-size:13px;border-bottom:1px solid #e0e0e0}.winlogo{display:grid;grid-template-columns:1fr 1fr;gap:3px;width:23px;height:23px;flex-shrink:0}.winlogo i{background:#0078d4}.body{padding:32px 42px;min-height:330px}h1{font-size:30px;font-weight:500;letter-spacing:-.7px;margin:0 0 15px}p{line-height:1.55}.muted{color:#616161}.footer{border-top:1px solid #ddd;padding:17px 28px;display:flex;gap:10px;justify-content:flex-end;align-items:center}.footer .stage{margin-right:auto;color:#666;font-size:12px}.btn{border:1px solid #ccc;background:#fff;border-radius:4px;padding:9px 22px;min-width:90px}.btn:hover{background:#f0f4fa}.primary{background:#0067c0;color:white;border-color:#0067c0}.primary:hover{background:#00599f}.field{display:block;margin:19px 0}.field>span{display:block;margin-bottom:7px}select,input[type=text]{padding:10px;border:1px solid #aaa;border-radius:4px;background:white;width:min(100%,380px)}.choice{display:flex;gap:15px;align-items:center;padding:17px;border:1px solid #ddd;border-radius:5px;margin:10px 0;background:white}.choice:has(input:checked){border-color:#0078d4;background:#eff7ff}.choice strong{display:block;font-weight:600;margin-bottom:5px}.choice small{color:#666}.notice{background:#edf4fb;border-radius:5px;padding:13px 16px;font-size:13px}.drive{border:1px solid #0078d4;background:#edf6ff;border-radius:4px;padding:20px;display:flex;justify-content:space-between;gap:20px;margin:26px 0}.install-step{margin:12px 0;color:#888}.install-step.done{color:#137c35}.install-step.current{color:#202020;font-weight:600}progress{accent-color:#0067c0;width:100%;height:10px}.large-percent{font-size:42px;font-weight:300;margin:30px 0 12px}.oobe{background:radial-gradient(ellipse at top right,#d6eaff,#f5f7fc 75%)}.oobe .card{box-shadow:0 20px 80px #194d9120;background:#ffffffdd;max-width:960px}.oobe .body{min-height:390px;padding:45px 50px}.oobe-art{font-size:80px;color:#0067c0;margin:0 0 20px}.boot{background:#000;color:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:65px}.boot .winlogo{width:95px;height:95px;gap:5px}.spinner{width:30px;height:30px;border:3px solid #ffffff30;border-top-color:white;border-right-color:white;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 20px}.boot-message{text-align:center;font-size:20px;font-weight:300}@keyframes spin{to{transform:rotate(360deg)}}.wallpaper{background:radial-gradient(ellipse at 76% 30%,#72c6ff,transparent 40%),radial-gradient(ellipse at 20% 95%,#173d9b,transparent 50%),linear-gradient(135deg,#052b69,#1677da 50%,#103786);isolation:isolate}.bloom{position:absolute;width:70vw;height:70vw;max-width:900px;max-height:900px;left:26%;top:-12%;border-radius:45% 55% 66% 34%;border:75px solid #5ab3f799;box-shadow:inset 25px 15px 60px #001d69,30px 30px 60px #0e2b83;transform:rotate(-25deg);z-index:-1}.bloom:after{content:'';position:absolute;inset:8%;border-radius:30% 60% 30% 60%;border:65px solid #2689e1;box-shadow:inset 30px 25px 50px #12387f,20px 20px 50px #091a61;transform:rotate(35deg)}.desktop-icons{position:absolute;left:15px;top:18px;display:grid;gap:20px;width:85px}.desktop-icon{border:1px solid transparent;background:none;color:white;padding:7px 0;border-radius:4px;text-shadow:0 1px 3px #000;display:grid;justify-items:center;gap:7px;font-size:12px}.desktop-icon:hover,.desktop-icon:focus{background:#ffffff20;border-color:#ffffff40}.app-icon{display:inline-grid;place-items:center;font-size:29px;line-height:1;width:38px;height:38px;border-radius:7px;text-shadow:none}.folder{color:#eeb339;background:linear-gradient(#ffe89b,#ffca50);height:28px;border-radius:3px;box-shadow:0 -5px 0 -1px #d49e26}.note{background:#e9f7ff;border:2px solid #159bd6;color:#3aa5d4;font-size:30px}.gear{color:#687887}.calc{background:#3b4e68;color:white;font-size:24px}.browser-icon{background:linear-gradient(30deg,#0955c7,#13d7b1);color:white;border-radius:50%;font:bold 29px Arial}.taskbar{position:absolute;bottom:0;left:0;right:0;height:52px;background:#edf4fbe8;backdrop-filter:blur(25px);display:flex;justify-content:center;align-items:center;border-top:1px solid #ffffff60;gap:5px;z-index:10000}.taskbar button{background:none;border:0;border-radius:4px;padding:7px;display:grid;place-items:center;position:relative}.taskbar button:hover{background:#ffffffb0}.taskbar button.running:after{content:'';position:absolute;bottom:1px;width:15px;height:3px;background:#0067c0;border-radius:3px}.taskbar .app-icon{width:28px;height:28px;font-size:23px}.taskbar .folder{height:22px}.tray{position:absolute;right:15px;font-size:11px;line-height:1.5;text-align:right;pointer-events:none}.start-menu{position:absolute;bottom:65px;left:50%;transform:translateX(-50%);width:min(560px,calc(100% - 24px));background:#f3f7fcee;backdrop-filter:blur(35px);border:1px solid #ffffffb0;box-shadow:0 15px 50px #001a4055;border-radius:9px;z-index:10001;padding:28px}.search{background:white;border:1px solid #ddd;border-bottom:2px solid #0078d4;padding:11px 15px;border-radius:5px;width:100%!important}.pinned{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}.pinned button{border:0;background:none;border-radius:5px;padding:12px 5px;display:grid;justify-items:center;gap:10px;font-size:12px}.pinned button:hover{background:white}.start-bottom{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #d4dce6;padding-top:18px}.user-badge{background:#cad8e9;border-radius:50%;display:inline-grid;place-items:center;width:30px;height:30px;margin-right:8px}.window{position:absolute;background:#f7f8fa;border:1px solid #ffffff99;border-radius:9px;box-shadow:0 20px 60px #0005;display:flex;flex-direction:column;width:min(740px,calc(100vw - 24px));height:min(490px,calc(100svh - 85px));overflow:hidden}.titlebar{display:flex;align-items:center;justify-content:space-between;height:38px;background:#eef2f8;user-select:none;touch-action:none;flex-shrink:0;padding-left:16px;font-size:12px}.window.active .titlebar{background:#e1edfb}.window-buttons{display:flex;height:100%}.window-buttons button{background:none;border:0;width:43px;font-size:18px}.window-buttons button:hover{background:#d1dbe8}.window-buttons button:last-child:hover{background:#c42b1c;color:white}.window-content{flex:1;min-height:0;overflow:auto;background:white;padding:24px}.window.maximized{left:0!important;top:0!important;width:100%!important;height:calc(100svh - 52px)!important;border-radius:0}.window textarea{width:100%;height:100%;border:0;outline:none;resize:none;font:15px/1.6 Consolas,monospace}.explorer{display:flex;gap:20px}.explorer nav{width:120px;border-right:1px solid #eee;flex-shrink:0}.explorer nav button{display:block;margin:4px 0;background:none;border:0;padding:9px;width:100%;text-align:left;border-radius:4px}.explorer nav button:hover{background:#eef5fc}.files{display:flex;flex-wrap:wrap;align-content:start;gap:15px}.file{background:none;border:1px solid transparent;border-radius:4px;padding:14px;display:grid;justify-items:center;gap:12px;min-width:90px}.file:hover{background:#eaf5ff;border-color:#bcd9f6}.setting{padding:15px;border:1px solid #ddd;border-radius:6px;margin:12px 0;display:flex;align-items:center;justify-content:space-between;gap:12px}.swatch{width:35px;height:35px;border:2px solid white;outline:1px solid #bbb;border-radius:5px}.calculator{max-width:330px;margin:auto}.calc-display{font-size:36px;text-align:right;padding:12px;min-height:70px;overflow-wrap:anywhere}.calc-keys{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.calc-keys button{padding:14px;border:1px solid #ddd;background:#f5f5f5;border-radius:5px;font-size:18px}.calc-keys button:hover{background:#e2eaf3}.local-page{text-align:center;padding:25px}.address{border:1px solid #ccc;border-radius:20px;padding:9px 15px;background:#f5f5f5;font-size:12px}.utility{position:fixed;bottom:10px;left:12px;z-index:20000;color:#ffffffb0;font-size:11px}.utility button{background:#182b45;color:#fff;border:1px solid #ffffff70;border-radius:4px;padding:5px 9px;font-size:11px}.utility.desktop-mode{bottom:60px;opacity:0}.utility.desktop-mode:hover,.utility.desktop-mode:focus-within{opacity:1}.empty{text-align:center;color:#777;padding:50px 10px}#off{display:grid;place-content:center;text-align:center;background:#000;color:white;gap:20px}@media(max-width:650px){.body,.oobe .body{padding:25px;min-height:300px}.tray{display:none}.taskbar{justify-content:center}.window{height:65svh}.bloom{border-width:35px;width:110vw;height:110vw;left:5%;top:10%}.bloom:after{border-width:30px}.explorer{gap:10px}.explorer nav{width:90px}.window-content{padding:15px}.stage{max-width:110px}.card{max-height:calc(100svh - 80px)}}@media(prefers-reduced-motion:reduce){.spinner{animation:none}}
</style>
</head>
<body>
<noscript><p style="color:white;padding:30px">Open this HTML file in a browser with JavaScript enabled to run the simulation.</p></noscript>
<section id="setup" class="screen setup"><div class="card"><div class="caption"><span class="winlogo" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span id="caption">Windows 11 Setup</span></div><div id="setup-body" class="body"></div><div id="setup-footer" class="footer"></div></div></section>
<section id="boot" class="screen boot" hidden><div class="winlogo" aria-hidden="true"><i></i><i></i><i></i><i></i></div><div class="boot-message"><div class="spinner" aria-hidden="true"></div><div id="boot-message" role="status">Restarting</div></div></section>
<main id="desktop" class="screen wallpaper" hidden aria-label="Simulated Windows 11 desktop"><div class="bloom" aria-hidden="true"></div><div class="desktop-icons"><button class="desktop-icon" data-app="explorer"><span class="app-icon">▣</span>This PC</button><button class="desktop-icon" data-app="recycle"><span class="app-icon">♻</span>Recycle Bin</button><button class="desktop-icon" data-app="browser"><span class="app-icon browser-icon">e</span>Browser</button></div><div id="windows"></div><section id="start-menu" class="start-menu" hidden aria-label="Start menu"><input id="app-search" class="search" placeholder="Search for apps" aria-label="Search apps"><h4>Pinned</h4><div id="pinned" class="pinned"></div><p class="muted">Welcome to your new desktop.</p><div class="start-bottom"><span><span class="user-badge">●</span><span id="account-name">User</span></span><button class="btn" id="power">⏻ Shut down</button></div></section><footer class="taskbar"><button id="start" aria-label="Start" aria-expanded="false"><span class="winlogo"><i></i><i></i><i></i><i></i></span></button><div id="task-apps" style="display:flex;gap:4px"></div><div class="tray">⌁ &nbsp; ◖))<br><time id="clock"></time></div></footer></main>
<section id="off" class="screen" hidden><p>Your simulated PC is off.</p><button class="btn" id="power-on">Power on</button></section>
<div id="utility" class="utility">Simulation · standalone <button id="fullscreen">Fullscreen</button></div>
<script>
(() => {
'use strict';
const $=id=>document.getElementById(id);
const state={name:'User',region:'United States',keyboard:'US',edition:'Windows 11 Pro',note:'',complete:false};
let timer=null;
const logo='<span class="winlogo" aria-hidden="true"><i></i><i></i><i></i><i></i></span>';
function button(label,action,primary=true){return `<button class="btn ${primary?'primary':''}" data-step="${action}">${label}</button>`;}
function show(title,body,actions,stage='Windows Setup',oobe=false){
  $('setup').hidden=false;$('boot').hidden=true;$('desktop').hidden=true;$('off').hidden=true;
  $('setup').classList.toggle('oobe',oobe);$('caption').textContent=oobe?'Let’s finish setting things up':'Windows 11 Setup';
  $('setup-body').innerHTML=`<h1 tabindex="-1">${title}</h1>${body}`;
  $('setup-footer').innerHTML=`<span class="stage">${stage}</span>${actions}`;
  $('setup-body').querySelector('h1').focus({preventScroll:true});
}
const steps={
 language(){show('Windows 11 Setup','<p>Choose your language and other preferences.</p><label class="field"><span>Language to install</span><select><option>English (United States)</option></select></label><label class="field"><span>Time and currency format</span><select><option>English (United States)</option><option>English (United Kingdom)</option></select></label><label class="field"><span>Keyboard or input method</span><select id="initial-keyboard"><option>US</option><option>United Kingdom</option></select></label>',button('Next','begin'));},
 begin(){state.keyboard=$('initial-keyboard')?.value||state.keyboard;show('Install Windows 11','<p>A fresh start for your PC.</p><div class="notice">Interactive setup simulation. Installation uses a virtual sample drive and does not change your computer.</div>',button('Back','language',false)+button('Install now','key'));},
 key(){show('Activate Windows','<p>If you have a product key, you would normally enter it here.</p><p class="notice">No product key is needed for this simulation.</p>',button('Back','begin',false)+button('I don’t have a product key','edition'));},
 edition(){show('Select the operating system you want to install',['Windows 11 Home','Windows 11 Pro'].map(x=>`<label class="choice"><input type="radio" name="edition" value="${x}" ${x===state.edition?'checked':''}><span><strong>${x}</strong><small>64-bit operating system</small></span></label>`).join(''),button('Back','key',false)+button('Next','terms'));},
 terms(){state.edition=document.querySelector('input[name=edition]:checked')?.value||state.edition;show('Notices and license terms','<p>In the Windows installer, this step displays Microsoft’s license terms.</p><div class="notice">This is an unofficial browser recreation. No Windows software is being installed or licensed through this page.</div><label class="field"><input id="accept" type="checkbox"> I understand this is a simulation.</label>',button('Back','edition',false)+'<button class="btn primary" data-step="type" id="terms-next" disabled>Next</button>');$('accept').addEventListener('change',e=>$('terms-next').disabled=!e.target.checked);},
 type(){show('Which type of installation do you want?','<p>Install a fresh copy of Windows on the sample drive.</p><button class="choice" data-step="disk"><span><strong>Custom: Install Windows only (advanced)</strong><small>Create a new Windows installation.</small></span></button>',button('Back','terms',false));},
 disk(){show('Where do you want to install Windows?','<div class="drive"><span>▣ &nbsp; Drive 0 Unallocated Space</span><strong>128.0 GB</strong></div><p class="muted">Sample virtual drive · 128.0 GB free</p><p>Setup will create the partitions it needs automatically.</p>',button('Back','type',false)+button('Next','install'));},
 install(){show('Installing Windows 11','<p>Your PC will restart several times. This might take a while.</p><div class="large-percent"><span id="percent">0</span>%</div><progress id="progress" max="100" value="0" aria-label="Installation progress"></progress><div id="install-steps"></div>','', 'Installing Windows');let n=0;const names=['Copying Windows files','Getting files ready for installation','Installing features','Installing updates','Finishing up'];function tick(){const current=Math.min(4,Math.floor(n/20));$('percent').textContent=n;$('progress').value=n;$('install-steps').innerHTML=names.map((name,i)=>`<div class="install-step ${i<current||n===100?'done':i===current?'current':''}">${i<current||n===100?'✓ ':''}${name}</div>`).join('');if(n===100){timer=setTimeout(()=>reboot(steps.region,'Getting ready'),1100);return;}n=Math.min(100,n+4);timer=setTimeout(tick,380);}tick();},
 region(){show('Is this the right country or region?','<div class="oobe-art" aria-hidden="true">◎</div><label class="field"><span>Country or region</span><select id="region"><option>United States</option><option>United Kingdom</option><option>Canada</option><option>Australia</option></select></label>',button('Yes','keyboard'),'Region',true);},
 keyboard(){state.region=$('region')?.value||state.region;show('Is this the right keyboard layout?','<div class="oobe-art" aria-hidden="true">▤</div><label class="field"><span>Keyboard layout</span><select id="keyboard"><option>US</option><option>United Kingdom</option></select></label>',button('Back','region',false)+button('Yes','secondKeyboard'),'Keyboard',true);$('keyboard').value=state.keyboard;},
 secondKeyboard(){state.keyboard=$('keyboard')?.value||state.keyboard;show('Want to add a second keyboard layout?','<p>You can add another layout later in Settings.</p>',button('Skip','network'),'Keyboard',true);},
 network(){show('Let’s connect you to a network','<div class="oobe-art" aria-hidden="true">⌁</div><div class="choice"><span><strong>Ethernet</strong><small>Connected · simulated connection</small></span></div>',button('Next','account'),'Network',true);},
 account(){show('Who’s going to use this device?','<p>Choose a name for your local account.</p><label class="field"><span>Your name</span><input id="username" type="text" maxlength="30" autocomplete="off" placeholder="Enter a name"></label><p class="muted">No Microsoft account or password is required in this preview.</p>',button('Next','privacy'),'Account',true);$('username').value=state.name==='User'?'':state.name;},
 privacy(){state.name=$('username')?.value.trim()||state.name;show('Choose privacy settings for your device','<p>Review the preferences for your simulated PC.</p>'+['Location','Find my device','Optional diagnostic data','Tailored experiences'].map((x,i)=>`<label class="setting"><span>${x}</span><input type="checkbox" id="privacy-${i}"></label>`).join('')+'<p class="muted">These switches only affect this preview.</p>',button('Back','account',false)+button('Accept','finish'),'Privacy',true);},
 finish(){state.complete=true;reboot(launchDesktop,'Hi. We’re getting everything ready for you.');}
};
function reboot(next,text='Restarting'){$('setup').hidden=true;$('desktop').hidden=true;$('off').hidden=true;$('boot').hidden=false;$('boot-message').textContent=text;timer=setTimeout(next,2800);}
$('setup').addEventListener('click',e=>{const b=e.target.closest('[data-step]');if(b&&!b.disabled)steps[b.dataset.step]();});
const apps={explorer:{name:'File Explorer',icon:'<span class="app-icon folder"></span>'},notepad:{name:'Notepad',icon:'<span class="app-icon note">≡</span>'},settings:{name:'Settings',icon:'<span class="app-icon gear">⚙</span>'},calculator:{name:'Calculator',icon:'<span class="app-icon calc">▦</span>'},browser:{name:'Browser',icon:'<span class="app-icon browser-icon">e</span>'},recycle:{name:'Recycle Bin',icon:'<span class="app-icon">♻</span>'}};
const windows=new Map();let z=20,active=null;
function menu(open){$('start-menu').hidden=!open;$('start').setAttribute('aria-expanded',String(open));if(open)$('app-search').focus();}
function launchDesktop(){$('boot').hidden=true;$('setup').hidden=true;$('off').hidden=true;$('desktop').hidden=false;$('utility').classList.add('desktop-mode');$('account-name').textContent=state.name;menu(false);$('start').focus();}
$('pinned').innerHTML=Object.entries(apps).map(([key,app])=>`<button data-app="${key}">${app.icon}<span>${app.name}</span></button>`).join('');
$('task-apps').innerHTML=Object.entries(apps).filter(([key])=>key!=='recycle').map(([key,app])=>`<button data-task="${key}" title="${app.name}" aria-label="${app.name}">${app.icon}</button>`).join('');
$('start').addEventListener('click',()=>menu($('start-menu').hidden));
$('app-search').addEventListener('input',e=>{for(const b of $('pinned').querySelectorAll('button'))b.hidden=!b.textContent.toLowerCase().includes(e.target.value.toLowerCase());});
function focusApp(id){const item=windows.get(id);if(!item)return;item.win.hidden=false;active=id;item.win.style.zIndex=++z;for(const [key,v]of windows)v.win.classList.toggle('active',key===id);}
function nextWindow(){active=null;const list=[...windows].filter(([,v])=>!v.win.hidden).sort((a,b)=>Number(b[1].win.style.zIndex)-Number(a[1].win.style.zIndex));if(list.length)focusApp(list[0][0]);}
function file(name,view){return `<button class="file" data-view="${view}"><span class="app-icon folder"></span>${name}</button>`;}
function explorerView(container,view='home'){container.innerHTML='<div class="explorer"><nav><button data-view="home">⌂ Home</button><button data-view="documents">Documents</button><button data-view="downloads">Downloads</button><button data-view="pictures">Pictures</button></nav><div style="flex:1"><h2></h2><div class="files"></div></div></div>';container.querySelector('h2').textContent={home:'This PC',documents:'Documents',downloads:'Downloads',pictures:'Pictures'}[view]||'This PC';const files=container.querySelector('.files');if(view==='home')files.innerHTML=file('Documents','documents')+file('Downloads','downloads')+file('Pictures','pictures')+'<p style="width:100%">▣ Local Disk (C:)<br><progress value="28" max="128"></progress><small>100 GB free of 128 GB · simulated</small></p>';else if(view==='documents')files.innerHTML='<button class="file" data-app="notepad"><span class="app-icon note">≡</span>Notes.txt</button>';else files.innerHTML='<p class="muted">This folder is empty.</p>';}
function populate(id,content){
 if(id==='explorer'){explorerView(content);content.addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(b)explorerView(content,b.dataset.view);});}
 if(id==='recycle')content.innerHTML='<div class="empty"><span style="font-size:50px">♻</span><p>The Recycle Bin is empty.</p></div>';
 if(id==='notepad'){content.innerHTML='<textarea aria-label="Notepad text" spellcheck="false" placeholder="Start typing…"></textarea>';const area=content.querySelector('textarea');area.value=state.note;area.addEventListener('input',()=>state.note=area.value);}
 if(id==='settings'){content.innerHTML='<h1>Settings</h1><div class="setting"><div><strong id="settings-name"></strong><p class="muted">Local account</p></div><span class="user-badge">●</span></div><h3>Personalization</h3><div class="setting"><span>Desktop color</span><div>'+['#0b3e87','#405785','#2f665e','#61467d'].map(c=>`<button class="swatch" data-color="${c}" style="background:${c}" aria-label="Desktop color ${c}"></button>`).join(' ')+'</div></div><h3>System</h3><p id="system-info"></p><p class="muted">This desktop is a browser simulation.</p>';$('settings-name').textContent=state.name;$('system-info').textContent=state.edition+' · '+state.region+' · '+state.keyboard+' keyboard';content.addEventListener('click',e=>{const b=e.target.closest('[data-color]');if(b)$('desktop').style.background=b.dataset.color;});}
 if(id==='browser')content.innerHTML='<div class="address">⌂ &nbsp; Welcome · local start page</div><div class="local-page"><span class="app-icon browser-icon" style="width:64px;height:64px;font-size:45px">e</span><h1 style="margin-top:25px">A fresh start.</h1><p>Your Windows 11 setup is complete.</p><p class="muted">Explore your desktop, write a note, or try the calculator.</p><button class="btn" data-app="notepad">Open Notepad</button></div>';
 if(id==='calculator'){content.innerHTML='<div class="calculator"><h3>Standard</h3><div class="calc-display" aria-live="polite">0</div><div class="calc-keys">'+['C','±','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','⌫','0','.','='].map(k=>`<button data-key="${k}">${k}</button>`).join('')+'</div></div>';let display='0',left=null,op=null,fresh=false;const render=()=>content.querySelector('.calc-display').textContent=display;const compute=()=>{const right=Number(display);let result=op==='+'?left+right:op==='−'?left-right:op==='×'?left*right:right===0?NaN:left/right;display=Number.isFinite(result)?String(Number(result.toPrecision(12))):'Cannot divide by zero';left=null;op=null;fresh=true;};content.addEventListener('click',e=>{const key=e.target.closest('[data-key]')?.dataset.key;if(!key)return;if(key==='C'){display='0';left=null;op=null;fresh=false;}else if(/^\d$/.test(key)){display=fresh||display==='0'?key:(display.length<14?display+key:display);fresh=false;}else if(key==='.'){if(fresh){display='0';fresh=false;}if(!display.includes('.'))display+='.';}else if(key==='±')display=String(-Number(display));else if(key==='%')display=String(Number(display)/100);else if(key==='⌫'){display=fresh?'0':display.slice(0,-1)||'0';fresh=false;}else if(key==='='){if(op!==null)compute();}else{if(op!==null&&!fresh)compute();left=Number(display);op=key;fresh=true;}render();});}
}
function openApp(id){if(!apps[id])return;menu(false);if(windows.has(id)){focusApp(id);return;}const win=document.createElement('section');win.className='window';win.setAttribute('aria-label',apps[id].name);win.style.left=Math.max(12,Math.min(145+windows.size*22,innerWidth-760))+'px';win.style.top=Math.max(12,Math.min(60+windows.size*22,innerHeight-560))+'px';win.innerHTML=`<div class="titlebar"><span>${apps[id].name}</span><div class="window-buttons"><button data-action="min" aria-label="Minimize">−</button><button data-action="max" aria-label="Maximize">□</button><button data-action="close" aria-label="Close">×</button></div></div><div class="window-content"></div>`;$('windows').append(win);windows.set(id,{win});const task=document.querySelector(`[data-task="${id}"]`);if(task)task.classList.add('running');populate(id,win.querySelector('.window-content'));focusApp(id);win.addEventListener('pointerdown',()=>focusApp(id));win.addEventListener('click',e=>{const action=e.target.closest('[data-action]')?.dataset.action;if(action==='min'){win.hidden=true;nextWindow();}if(action==='max')win.classList.toggle('maximized');if(action==='close'){win.remove();windows.delete(id);if(task)task.classList.remove('running');nextWindow();}});const bar=win.querySelector('.titlebar');let drag=null;bar.addEventListener('pointerdown',e=>{if(e.target.closest('button')||win.classList.contains('maximized'))return;const rect=win.getBoundingClientRect();drag={x:e.clientX-rect.left,y:e.clientY-rect.top};bar.setPointerCapture(e.pointerId);});bar.addEventListener('pointermove',e=>{if(!drag)return;win.style.left=Math.max(0,Math.min(innerWidth-win.offsetWidth,e.clientX-drag.x))+'px';win.style.top=Math.max(0,Math.min(innerHeight-85,e.clientY-drag.y))+'px';});bar.addEventListener('pointerup',()=>drag=null);bar.addEventListener('pointercancel',()=>drag=null);bar.addEventListener('dblclick',e=>{if(!e.target.closest('button'))win.classList.toggle('maximized');});}
$('desktop').addEventListener('click',e=>{const app=e.target.closest('[data-app]');if(app&&!app.classList.contains('desktop-icon'))openApp(app.dataset.app);const task=e.target.closest('[data-task]');if(task){const id=task.dataset.task;const entry=windows.get(id);if(entry&&active===id&&!entry.win.hidden){entry.win.hidden=true;nextWindow();}else openApp(id);}if(!e.target.closest('#start-menu')&&!e.target.closest('#start'))menu(false);});
for(const icon of document.querySelectorAll('.desktop-icon')){icon.addEventListener('dblclick',()=>openApp(icon.dataset.app));icon.addEventListener('click',e=>{if(e.detail===0)openApp(icon.dataset.app);});icon.addEventListener('pointerup',e=>{if(e.pointerType==='touch')openApp(icon.dataset.app);});}
$('power').addEventListener('click',()=>{menu(false);reboot(()=>{$('boot').hidden=true;$('off').hidden=false;},'Shutting down');});
$('power-on').addEventListener('click',()=>reboot(launchDesktop,'Welcome'));

function updateClock(){$('clock').textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})+' · '+new Date().toLocaleDateString();}updateClock();setInterval(updateClock,1000);
