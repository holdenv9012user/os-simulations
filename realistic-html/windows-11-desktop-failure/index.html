<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>Windows 11 Desktop Failure — Simulation</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; color: white; }
  body { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
  [hidden] { display: none !important; }
  .boot { position: absolute; inset: 0; background: #000; }
  .logo { position: absolute; left: 50%; top: 33%; transform: translate(-50%, -50%); display: grid; grid-template-columns: repeat(2, 48px); gap: 5px; }
  .logo i { width: 48px; height: 48px; background: #00a2ed; }
  .loading { position: absolute; top: 65%; width: 100%; text-align: center; }
  .spinner { width: 32px; height: 32px; margin: 0 auto 22px; border: 3px solid #ffffff20; border-top-color: white; border-right-color: white; border-radius: 50%; animation: spin 1.1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #boot-text { font-size: 19px; font-weight: 300; }
  #session { position: absolute; inset: 0; background: #070707; overflow: hidden; }
  .cmd { position: absolute; width: min(620px, 86vw); height: min(310px, 53vh); min-height: 125px; border: 1px solid #707070; border-radius: 7px; overflow: hidden; background: #0c0c0c; box-shadow: 0 12px 35px #0008; }
  .titlebar { height: 32px; background: #f3f3f3; color: #222; display: flex; align-items: center; padding-left: 12px; font-size: 12px; user-select: none; }
  .cmd-icon { background: #171717; border: 1px solid #888; color: white; width: 17px; height: 13px; margin-right: 8px; font: 9px/11px Consolas, monospace; text-align: center; }
  .caption { flex: 1; }
  .window-controls { display: flex; height: 100%; align-items: center; }
  .window-controls span { display: grid; place-items: center; width: 41px; height: 100%; font: 16px Arial, sans-serif; }
  .console { padding: 8px; color: #ccc; font: clamp(12px, 1.1vw, 15px)/1.35 Consolas, 'Courier New', monospace; white-space: pre-wrap; }
  .console b { font-weight: normal; color: #fff; }
  .cursor { display: inline-block; width: 8px; height: 2px; background: #ccc; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  #firmware { position: absolute; inset: 0; background: black; }
  .controls { position: fixed; bottom: 15px; right: 20px; left: 20px; z-index: 1000; display: flex; justify-content: flex-end; align-items: center; flex-wrap: wrap; gap: 12px; font-size: 12px; opacity: 0; transition: opacity .2s; }
  .controls-visible .controls, .controls:hover, .controls:focus-within { opacity: 1; }
  button { color: white; background: #202020; border: 1px solid #ffffff60; border-radius: 3px; padding: 7px 11px; font: inherit; cursor: pointer; }
  button:hover { background: #353535; }
  button:focus-visible { outline: 2px solid white; outline-offset: 4px; }
  @media (prefers-reduced-motion: reduce) { .spinner, .cursor { animation: none; } .controls { transition: none; } }
</style>
</head>
<body class="controls-visible">
<main aria-label="Windows desktop failure simulation">
  <section class="boot" id="boot" aria-label="Windows 11 boot">
    <div class="logo" id="logo" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <div class="loading"><div class="spinner" aria-hidden="true"></div><div id="boot-text" role="status"></div></div>
  </section>
  <section id="session" aria-label="Simulated command windows reporting desktop failure" hidden></section>
  <section id="firmware" aria-label="Simulated UEFI firmware with blank display" hidden></section>
</main>
<div class="controls" aria-label="Simulation controls">
  <span id="phase">Simulation</span>
  <button id="replay" type="button">Replay boot</button>
  <button id="fullscreen" type="button">Fullscreen</button>
</div>
<script>
  const boot = document.getElementById('boot');
  const logo = document.getElementById('logo');
  const bootText = document.getElementById('boot-text');
  const session = document.getElementById('session');
  const firmware = document.getElementById('firmware');
  const phase = document.getElementById('phase');
  let timers = [];
  function later(delay, fn) { timers.push(setTimeout(fn, delay)); }
  function clearSequence() { timers.forEach(clearTimeout); timers = []; }
  function addWindow(index) {
    const win = document.createElement('div');
    win.className = 'cmd';
    // All windows are contained in this page; no browser popups or commands run.
    win.innerHTML = '<div class="titlebar"><span class="cmd-icon">&gt;_</span><span class="caption">C:\\Windows\\System32\\cmd.exe</span><span class="window-controls" aria-hidden="true"><span>−</span><span>□</span><span>×</span></span></div><div class="console">Microsoft Windows [Version 10.0.22631.3155]\n(c) Microsoft Corporation. All rights reserved.\n\n<b>Your desktop failed to load!</b>\n\nC:\\Windows\\System32&gt;<span class="cursor" aria-hidden="true"></span></div>';
    const width = Math.min(620, innerWidth * .86);
    const height = Math.max(125, Math.min(310, innerHeight * .53));
    const availableX = Math.max(0, innerWidth - width - 12);
    const availableY = Math.max(0, innerHeight - height - 55);
    const group = Math.floor(index / 9);
    const step = index % 9;
    win.style.left = `${6 + ((group * 149 + step * 29) % (availableX + 1))}px`;
    win.style.top = `${6 + ((group * 83 + step * 24) % (availableY + 1))}px`;
    session.appendChild(win);
    phase.textContent = `Simulation · ${index + 1} / 45 CMD windows`;
  }
  function reboot() {
    session.hidden = true;
    session.replaceChildren();
    boot.hidden = false;
    logo.hidden = true;
    bootText.textContent = 'Restarting';
    phase.textContent = 'Simulation · Restarting';
    later(1900, () => {
      boot.hidden = true;
      firmware.hidden = false;
      phase.textContent = 'Simulation · UEFI blank display';
      // Remain on the completely black firmware display indefinitely.
      document.body.classList.remove('controls-visible');
    });
  }
  function desktopFailure() {
    boot.hidden = true;
    session.hidden = false;
    phase.textContent = 'Simulation · Desktop unavailable';
    for (let index = 0; index < 45; index++) later(500 + index * 155, () => addWindow(index));
    later(500 + 44 * 155 + 1300, reboot);
  }
  function start() {
    clearSequence();
    session.replaceChildren();
    session.hidden = true;
    firmware.hidden = true;
    boot.hidden = false;
    logo.hidden = false;
    bootText.textContent = '';
    phase.textContent = 'Simulation · Windows boot';
    later(3200, () => { bootText.textContent = 'Welcome'; });
    later(4600, desktopFailure);
  }
  document.getElementById('replay').addEventListener('click', start);
  const fullscreen = document.getElementById('fullscreen');
  if (!document.fullscreenEnabled) fullscreen.hidden = true;
  fullscreen.addEventListener('click', async () => {
    try {
      if (document.fullscreenElement) await document.exitFullscreen();
      else await document.documentElement.requestFullscreen();
    } catch { fullscreen.textContent = 'Fullscreen unavailable'; }
  });
  document.addEventListener('fullscreenchange', () => {
    fullscreen.textContent = document.fullscreenElement ? 'Exit fullscreen' : 'Fullscreen';
  });
  let controlsTimer;
  function reveal() {
    document.body.classList.add('controls-visible');
    clearTimeout(controlsTimer);
    controlsTimer = setTimeout(() => document.body.classList.remove('controls-visible'), 2200);
  }
  document.addEventListener('pointermove', reveal);
  document.addEventListener('pointerdown', reveal);
  reveal();
  start();
</script>
</body>
</html>
